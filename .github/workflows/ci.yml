name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Valores de ejemplo: el build valida la forma de las variables, y ningún paso se conecta a servicios reales.
env:
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_example
  DATABASE_URL: postgresql://postgres:password@localhost:5432/postgres

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
