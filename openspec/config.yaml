schema: spec-driven

context: |
  Language: es
  All artifacts must be written in es.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Proyecto: Ludoteca, web personal (PWA) para llevar la biblioteca de videojuegos, en qué tienda está cada juego y las suscripciones. Uso personal, con el modelo de datos preparado para varios usuarios y el registro cerrado.
  Restricción dura: costo cero, solo planes gratis.
  Stack: Next.js (App Router) + TypeScript estricto en Vercel Hobby; Supabase (Postgres, Auth, Storage); Drizzle ORM; Zod; CSS Modules + tokens; Radix sin estilos; Vitest, React Testing Library, MSW, PGlite y Playwright.
  Arquitectura: app/ → service/ → persistence/repository/ → base de datos; las APIs externas solo por adapter/<proveedor>/; las reglas de negocio son funciones puras en model/. Cada repositorio filtra por el usuario de la sesión.
  Interfaz en español rioplatense con voseo; código en inglés.
  Las etapas se implementan en orden (01 a 08) y cada una se archiva antes de la siguiente.
  Fuentes: docs/decisiones.md (decisiones y supuestos; manda sobre la idea), docs/ludoteca-idea.md (idea original), design/*.dc.html (diseño: 1440 px PC, 390 px celu), CLAUDE.md (convenciones y definición de terminado).

rules:
  proposal:
    - Decí qué queda fuera de alcance.
    - Si algo contradice docs/decisiones.md, señalalo y preguntá antes de seguir.
  specs:
    - Cada requisito describe un solo comportamiento observable y tiene al menos un escenario.
    - Los escenarios usan ejemplos concretos, con juegos reales.
    - Nada de nombres de tablas, librerías ni funciones en las specs.
  design:
    - Respetá las capas y el árbol de carpetas de CLAUDE.md; si hace falta una carpeta nueva, proponela.
    - Nombrá las pantallas de design/ que se implementan y en qué difieren del diseño.
    - Toda dependencia nueva va con su justificación.
  tasks:
    - Cada tarea incluye sus tests; cada escenario de las specs tiene al menos un test con su mismo nombre.
    - Tareas chicas, que se terminen en una sentada y dejen la app funcionando.
    - La última tarea es verificar la definición de terminado de CLAUDE.md.

operations:
  apply:
    guidance:
      - Antes de cada tarea, releé la spec del cambio y las reglas de CLAUDE.md.
      - No modifiques ni borres tests existentes sin un «sí» explícito del usuario.
  archive:
    guidance:
      - Antes de archivar, confirmá que se cumple la definición de terminado de CLAUDE.md.
