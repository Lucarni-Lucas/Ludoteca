<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ludoteca · Cambiar estado</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500&amp;family=Space+Grotesk:wght@500;700&amp;display=swap">
<style>
body{margin:0;background:#0E1014}
a{color:#C8F25A}a:hover{color:#DDF79A}
input::placeholder,textarea::placeholder{color:#7D8696}
</style>
</helmet>
<div style="position: relative; width: 390px; min-height: 1300px; box-sizing: border-box; background: #07080A; color: #ECEEF2; font: 400 15px/1.45 Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">

  <div aria-hidden="true" style="height: 110px; box-sizing: border-box; padding: 60px 20px 0; color: #4E5562; font: 700 22px/1 'Space Grotesk', Arial, sans-serif">Disco Elysium</div>

  <section aria-label="Cambiar estado" style="box-sizing: border-box; min-height: 1190px; padding: 10px 20px 130px; border-radius: 24px 24px 0 0; background: #12151B; border-top: 1px solid #2A303B; display: flex; flex-direction: column; gap: 22px">
    <span aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 99px; background: #3A414E"></span>

    <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
      <div>
        <h1 style="margin: 0; font: 700 24px/1.1 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; letter-spacing: -0.02em">Cambiar estado</h1>
        <p style="margin: 4px 0 0; color: #9AA3B2; font-size: 14px">Disco Elysium · ahora: Jugando</p>
      </div>
      <a href="Movil-Juego.dc.html" aria-label="Cerrar" style="flex: none; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; color: #ECEEF2">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
      </a>
    </div>

    <div style="display: flex; flex-direction: column; gap: 14px">
      <sc-for list="{{groups}}" as="gr" hint-placeholder-count="4">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <span style="font: 500 11px/1 'JetBrains Mono', ui-monospace, monospace; letter-spacing: 0.08em; text-transform: uppercase; color: #9AA3B2">{{gr.label}}</span>
          <div style="display: flex; flex-wrap: wrap; gap: 8px">
            <sc-for list="{{gr.statuses}}" as="t" hint-placeholder-count="2">
              <button type="button" onClick="{{t.pick}}" aria-pressed="{{t.active}}" style="{{t.style}}">{{t.label}}</button>
            </sc-for>
          </div>
        </div>
      </sc-for>
      <a href="Movil-Estados.dc.html" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; font-size: 14px; font-weight: 600; text-decoration: none">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"></path></svg>
        Editar o crear estados
      </a>
    </div>

    <sc-if value="{{askWhy}}" hint-placeholder-val="{{ true }}">
      <section style="display: flex; flex-direction: column; gap: 16px; padding-top: 18px; border-top: 1px solid #222832">
        <div>
          <h2 style="margin: 0; font: 700 18px/1.2 'Space Grotesk', Arial, sans-serif">{{whyTitle}}</h2>
          <p style="margin: 4px 0 0; font-size: 13px; color: #9AA3B2">Todo es opcional. Queda en el diario del juego.</p>
        </div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
          <label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #C5CCD8">Horas jugadas
            <input type="number" min="0" defaultValue="18" style="height: 48px; box-sizing: border-box; padding: 0 12px; border-radius: 12px; background: #0E1014; border: 1px solid #2A303B; color: #ECEEF2; font: 500 16px/1 'JetBrains Mono', ui-monospace, monospace">
          </label>
          <label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #C5CCD8">Progreso (%)
            <input type="number" min="0" max="100" placeholder="—" style="height: 48px; box-sizing: border-box; padding: 0 12px; border-radius: 12px; background: #0E1014; border: 1px solid #2A303B; color: #ECEEF2; font: 500 16px/1 'JetBrains Mono', ui-monospace, monospace">
          </label>
        </div>
        <label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #C5CCD8">Hasta dónde llegaste
          <input type="text" placeholder="Ej: día 3, capítulo 5, el jefe del pantano" style="height: 48px; box-sizing: border-box; padding: 0 12px; border-radius: 12px; background: #0E1014; border: 1px solid #2A303B; color: #ECEEF2; font: 400 15px/1 Inter, system-ui, sans-serif">
        </label>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <span style="font-size: 13px; color: #C5CCD8">Motivo (podés elegir varios)</span>
          <div style="display: flex; flex-wrap: wrap; gap: 8px">
            <sc-for list="{{reasons}}" as="r" hint-placeholder-count="6">
              <button type="button" onClick="{{r.pick}}" aria-pressed="{{r.active}}" style="{{r.style}}">{{r.label}}</button>
            </sc-for>
            <button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 44px; padding: 0 14px; border-radius: 999px; border: 1px dashed #3A414E; background: transparent; color: #C5CCD8; font: 500 14px/1 Inter, system-ui, sans-serif; cursor: pointer">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
              Otro
            </button>
          </div>
        </div>
        <label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #C5CCD8">Nota
          <textarea rows="3" placeholder="Lo que quieras recordar para cuando lo retomes." style="box-sizing: border-box; width: 100%; padding: 12px; border-radius: 12px; background: #0E1014; border: 1px solid #2A303B; color: #ECEEF2; font: 400 15px/1.45 Inter, system-ui, sans-serif; resize: vertical"></textarea>
        </label>
      </section>
    </sc-if>

    <sc-if value="{{finished}}" hint-placeholder-val="{{ false }}">
      <p style="margin: 0; padding-top: 18px; border-top: 1px solid #222832; font-size: 14px; color: #C5CCD8">Se guarda la fecha de hoy como fecha de fin. Después podés ponerle puntaje y reseña.</p>
    </sc-if>
  </section>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 20px 30px; background: rgba(18,21,27,0.97); border-top: 1px solid #222832">
    <a href="Movil-Juego.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 14px; background: #C8F25A; color: #0E1014; text-decoration: none; font: 600 16px/1 Inter, system-ui, sans-serif">{{cta}}</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1300}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const status = st.status || 'abandonado';
    const picked = st.reasons || ['Me falta tiempo'];
    const GROUPS = [
      ['En curso', [['jugando', 'Jugando'], ['pausa', 'En pausa'], ['sinfin', 'Sin fin']]],
      ['Sin empezar', [['quiero', 'Quiero jugarlo'], ['pendiente', 'Pendiente']]],
      ['Terminado', [['completado', 'Completado'], ['cien', '100%']]],
      ['Dejado', [['abandonado', 'Abandonado'], ['loprobe', 'Lo probé']]]
    ];
    const LABEL = {};
    GROUPS.forEach(([, list]) => list.forEach(([id, l]) => { LABEL[id] = l; }));
    const pill = (active) => active
      ? 'display: inline-flex; align-items: center; height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #C8F25A; background: #C8F25A; color: #0E1014; font: 600 14px/1 Inter, system-ui, sans-serif; cursor: pointer'
      : 'display: inline-flex; align-items: center; height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #2A303B; background: transparent; color: #C5CCD8; font: 500 14px/1 Inter, system-ui, sans-serif; cursor: pointer';
    const soft = (active) => active
      ? 'display: inline-flex; align-items: center; height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid #FF9C8A; background: rgba(255,156,138,0.12); color: #FFC2B7; font: 600 14px/1 Inter, system-ui, sans-serif; cursor: pointer'
      : 'display: inline-flex; align-items: center; height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid #2A303B; background: transparent; color: #C5CCD8; font: 500 14px/1 Inter, system-ui, sans-serif; cursor: pointer';

    const groups = GROUPS.map(([label, list]) => ({
      label,
      statuses: list.map(([id, l]) => ({
        label: l,
        active: status === id,
        style: pill(status === id),
        pick: () => this.setState({ status: id })
      }))
    }));
    const reasons = ['Me aburrió', 'Muy difícil', 'Problemas técnicos', 'Me falta tiempo', 'Lo retomo después', 'Sin gente para jugar'].map((label) => {
      const active = picked.indexOf(label) >= 0;
      return {
        label,
        active,
        style: soft(active),
        pick: () => this.setState({ reasons: active ? picked.filter((x) => x !== label) : picked.concat([label]) })
      };
    });

    const askWhy = ['pausa', 'abandonado', 'loprobe'].indexOf(status) >= 0;
    return {
      groups,
      reasons,
      askWhy,
      finished: status === 'completado' || status === 'cien',
      whyTitle: status === 'pausa' ? '¿Por qué lo pausás?' : '¿Por qué lo dejás?',
      cta: `Guardar como «${LABEL[status]}»`
    };
  }
}
</script>
</body>
</html>
