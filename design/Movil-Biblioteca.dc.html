<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ludoteca · Biblioteca (móvil)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500&amp;family=Space+Grotesk:wght@500;700&amp;display=swap">
<style>
body{margin:0;background:#0E1014}
a{color:#ECEEF2}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; background: #0E1014; color: #ECEEF2; font: 400 15px/1.45 Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">

  <div style="padding: 60px 20px 0; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
      <div style="min-width: 0">
        <h1 style="margin: 0; font: 700 32px/1 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; letter-spacing: -0.03em">Biblioteca</h1>
        <p style="margin: 6px 0 0; color: #9AA3B2; font-size: 13px">{{summary}}</p>
      </div>
      <div style="display: flex; gap: 6px; flex: none">
        <a href="Movil-Filtros.dc.html" aria-label="Filtros" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid #2A303B; display: grid; place-items: center; color: #ECEEF2">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M7 12h10M10 17h4"></path></svg>
        </a>
        <a href="Movil-Agregar.dc.html" aria-label="Agregar juego" style="width: 44px; height: 44px; border-radius: 999px; background: #C8F25A; color: #0E1014; display: grid; place-items: center">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        </a>
      </div>
    </div>
    <a href="Movil-LoTengo.dc.html" style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; border-radius: 12px; background: #161A21; border: 1px solid #2A303B; color: #9AA3B2; text-decoration: none; font-size: 15px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      ¿Lo tengo? Buscá un juego…
    </a>
  </div>

  <div style="display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 14px 20px 2px">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
      <button type="button" onClick="{{t.pick}}" aria-pressed="{{t.active}}" style="{{t.style}}">{{t.label}}<span style="{{t.countStyle}}">{{t.count}}</span></button>
    </sc-for>
  </div>

  <a href="Movil-LoTengo.dc.html" style="margin: 12px 20px 0; display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 12px 14px; border-radius: 12px; background: #1C1810; border: 1px solid #4A3B1E; text-decoration: none; color: #F4E6CC">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFC66B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 2 20h20L12 3z"></path><path d="M12 10v4"></path><path d="M12 17h.01"></path></svg>
    <span style="flex: 1; font-size: 14px; line-height: 1.35"><strong style="font-weight: 600">Civilization VI</strong> está dos veces: en Epic Games y en Steam</span>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
  </a>

  <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 6px 20px 110px">
    <sc-for list="{{games}}" as="g" hint-placeholder-count="6">
      <a href="Movil-Juego.dc.html" style="display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid #1C2129; text-decoration: none; color: #ECEEF2">
        <span aria-hidden="true" style="{{g.coverStyle}}">{{g.mono}}</span>
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px">
          <span style="font-weight: 600; font-size: 15px; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{g.title}}</span>
          <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; line-height: 1; color: #9AA3B2">
            <span style="{{g.statusStyle}}">{{g.statusLabel}}</span>
            <sc-if value="{{g.showHours}}" hint-placeholder-val="{{ true }}">
              <span>· {{g.hoursText}}</span>
            </sc-if>
          </span>
          <span style="display: flex; flex-wrap: wrap; gap: 5px">
            <sc-for list="{{g.stores}}" as="s" hint-placeholder-count="1">
              <span style="{{s.style}}">{{s.label}}</span>
            </sc-for>
          </span>
        </span>
        <sc-if value="{{g.rated}}" hint-placeholder-val="{{ true }}">
          <span style="flex: none; font: 500 19px/1 'JetBrains Mono', ui-monospace, monospace">{{g.scoreText}}</span>
        </sc-if>
      </a>
    </sc-for>
    <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
      <p style="margin: 24px 0 0; color: #9AA3B2; text-align: center">No hay juegos en este grupo.</p>
    </sc-if>
  </div>

  <nav aria-label="Secciones" style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; padding: 6px 8px 26px; background: rgba(14,16,20,0.97); border-top: 1px solid #222832">
    <a href="Movil-Biblioteca.dc.html" aria-current="page" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; min-height: 52px; text-decoration: none; color: #C8F25A; font: 600 11px/1 Inter, system-ui, sans-serif">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="4.5" height="16" rx="1"></rect><rect x="9.5" y="4" width="4.5" height="16" rx="1"></rect><path d="M15.6 5.4l3.9-1 3.6 14.5-3.9 1z"></path></svg>
      Biblioteca
    </a>
    <a href="Movil-LoTengo.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; min-height: 52px; text-decoration: none; color: #9AA3B2; font: 500 11px/1 Inter, system-ui, sans-serif">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      ¿Lo tengo?
    </a>
    <a href="Movil-Suscripciones.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; min-height: 52px; text-decoration: none; color: #9AA3B2; font: 500 11px/1 Inter, system-ui, sans-serif">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 10h18"></path><path d="M7 15h4"></path></svg>
      Suscripciones
    </a>
    <a href="Movil-Tiendas.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; min-height: 52px; text-decoration: none; color: #9AA3B2; font: 500 11px/1 Inter, system-ui, sans-serif">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1 12H6L5 8z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg>
      Tiendas
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  games() {
    return [
      { title: 'Disco Elysium', mono: 'DE', status: 'jugando', score: 9.3, hours: 18, bg: '#4A2A22', fg: '#F2D9C9', stores: [{ s: 'gog', k: 'comprado' }] },
      { title: 'Forza Horizon 5', mono: 'FH', status: 'sinfin', score: 8.1, hours: 31, bg: '#1F3A3A', fg: '#CDEDEB', stores: [{ s: 'gp', k: 'susc' }] },
      { title: 'Civilization VI', mono: 'CV', status: 'sinfin', score: 7.4, hours: 112, bg: '#2E3B23', fg: '#E3EFCF', stores: [{ s: 'epic', k: 'gratis' }, { s: 'steam', k: 'comprado' }] },
      { title: 'Frostpunk', mono: 'FP', status: 'quiero', score: 0, hours: 0, bg: '#26303A', fg: '#DCE6EF', stores: [] },
      { title: 'Cyberpunk 2077', mono: 'CP', status: 'pausa', score: 7.9, hours: 21, bg: '#3D3A12', fg: '#F2EEB3', stores: [{ s: 'gog', k: 'comprado' }] },
      { title: 'Hades', mono: 'HA', status: 'cien', score: 9.6, hours: 64, bg: '#4A1E25', fg: '#F6CFD3', stores: [{ s: 'steam', k: 'comprado' }] },
      { title: 'Outer Wilds', mono: 'OW', status: 'pendiente', score: 0, hours: 0, bg: '#2A2442', fg: '#DCD5F5', stores: [{ s: 'steam', k: 'comprado' }] },
      { title: 'Hollow Knight', mono: 'HK', status: 'completado', score: 9.8, hours: 48, bg: '#22304A', fg: '#DCE6F7', stores: [{ s: 'steam', k: 'comprado' }] },
      { title: 'Portal 2', mono: 'P2', status: 'completado', score: 9.0, hours: 9, bg: '#2B3036', fg: '#E2E6EA', stores: [{ s: 'steam', k: 'familia' }] },
      { title: 'Cartas del Faro', mono: 'CF', status: 'completado', score: 8.0, hours: 1, bg: '#3A2E1F', fg: '#F0E0C8', stores: [{ s: 'itch', k: 'gratis' }] },
      { title: 'Stardew Valley', mono: 'SV', status: 'sinfin', score: 9.0, hours: 140, bg: '#2D4220', fg: '#E1F0CF', stores: [{ s: 'steam', k: 'comprado' }, { s: 'sw', k: 'fisico' }] },
      { title: 'Celeste', mono: 'CE', status: 'completado', score: 8.7, hours: 22, bg: '#3F2240', fg: '#F1D2F2', stores: [{ s: 'epic', k: 'comprado' }] },
      { title: 'Ori and the Will of the Wisps', mono: 'OR', status: 'completado', score: 8.8, hours: 13, bg: '#1D3340', fg: '#CFE6F2', stores: [{ s: 'gp', k: 'perdido' }] },
      { title: 'Elden Ring', mono: 'ER', status: 'loprobe', score: 6.5, hours: 3, bg: '#3A3426', fg: '#EFE6CF', stores: [{ s: 'steam', k: 'comprado' }] },
      { title: 'Sea of Thieves', mono: 'ST', status: 'abandonado', score: 5.5, hours: 9, bg: '#163029', fg: '#CBEDE3', stores: [{ s: 'ms', k: 'comprado' }] },
      { title: 'Grand Theft Auto V', mono: 'GT', status: 'abandonado', score: 6.2, hours: 14, bg: '#3A2F18', fg: '#F4E3B8', stores: [{ s: 'epic', k: 'gratis' }] }
    ];
  }

  renderVals() {
    const st = this.state || {};
    const group = st.group || 'todos';
    const all = this.games();
    const STORE = { steam: 'Steam', epic: 'Epic', gog: 'GOG', ms: 'MS Store', gp: 'Game Pass', sw: 'Switch', itch: 'itch.io' };
    const KIND = { gratis: 'Gratis', susc: 'Susc.', familia: 'Familia', fisico: 'Físico', perdido: 'Ya no' };
    const LABEL = { jugando: 'Jugando', pausa: 'En pausa', sinfin: 'Sin fin', quiero: 'Quiero jugarlo', pendiente: 'Pendiente', completado: 'Completado', cien: '100%', abandonado: 'Abandonado', loprobe: 'Lo probé' };
    const GROUP_OF = { jugando: 'curso', pausa: 'curso', sinfin: 'curso', quiero: 'empezar', pendiente: 'empezar', completado: 'terminado', cien: 'terminado', abandonado: 'dejado', loprobe: 'dejado' };
    const COLOR = { curso: '#C8F25A', empezar: '#C5CCD8', terminado: '#8EC5FF', dejado: '#FF9C8A' };

    const chip = (k) => k === 'perdido'
      ? "font: 500 10px/1 'JetBrains Mono', ui-monospace, monospace; letter-spacing: 0.04em; text-transform: uppercase; padding: 4px 6px; border-radius: 5px; border: 1px dashed #4A5160; color: #9AA3B2; text-decoration: line-through"
      : "font: 500 10px/1 'JetBrains Mono', ui-monospace, monospace; letter-spacing: 0.04em; text-transform: uppercase; padding: 4px 6px; border-radius: 5px; border: 1px solid #353C48; color: #C5CCD8";

    const games = all
      .filter((g) => group === 'todos' || GROUP_OF[g.status] === group)
      .map((g) => {
        const wish = g.stores.length === 0;
        const stores = g.stores.map((x) => ({ label: KIND[x.k] ? `${STORE[x.s]} · ${KIND[x.k]}` : STORE[x.s], style: chip(x.k) }));
        if (wish) stores.push({ label: 'Sin comprar', style: "font: 500 10px/1 'JetBrains Mono', ui-monospace, monospace; letter-spacing: 0.04em; text-transform: uppercase; padding: 4px 6px; border-radius: 5px; border: 1px dashed #4A5160; color: #9AA3B2" });
        return {
          title: g.title,
          mono: g.mono,
          rated: g.score > 0,
          scoreText: g.score.toFixed(1),
          statusLabel: LABEL[g.status],
          statusStyle: `color: ${g.status === 'quiero' ? '#FFC66B' : COLOR[GROUP_OF[g.status]]}; font-weight: 500`,
          showHours: !wish,
          hoursText: g.hours ? `${g.hours} h` : 'sin empezar',
          stores,
          coverStyle: `flex: none; width: 48px; height: 64px; box-sizing: border-box; border-radius: 8px; padding: 6px; display: flex; align-items: flex-end; background-color: ${g.bg}; background-image: repeating-linear-gradient(135deg, rgba(255,255,255,0.05) 0 2px, transparent 2px 10px); color: ${g.fg}; font: 700 17px/0.9 'Space Grotesk', Arial, sans-serif; letter-spacing: -0.03em; border: ${wish ? '1px dashed rgba(255,255,255,0.4)' : '1px solid rgba(255,255,255,0.07)'}`
        };
      });

    const tabs = [['todos', 'Todos'], ['curso', 'En curso'], ['empezar', 'Sin empezar'], ['terminado', 'Terminado'], ['dejado', 'Dejado']]
      .map(([id, label]) => {
        const active = group === id;
        return {
          label,
          active,
          count: id === 'todos' ? all.length : all.filter((g) => GROUP_OF[g.status] === id).length,
          pick: () => this.setState({ group: id }),
          style: active
            ? 'flex: none; display: inline-flex; align-items: center; gap: 7px; height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid #C8F25A; background: #C8F25A; color: #0E1014; font: 600 14px/1 Inter, system-ui, sans-serif; cursor: pointer'
            : 'flex: none; display: inline-flex; align-items: center; gap: 7px; height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid #2A303B; background: transparent; color: #C5CCD8; font: 500 14px/1 Inter, system-ui, sans-serif; cursor: pointer',
          countStyle: active
            ? "font: 500 11px/1 'JetBrains Mono', ui-monospace, monospace; color: #33401A"
            : "font: 500 11px/1 'JetBrains Mono', ui-monospace, monospace; color: #8A93A3"
        };
      });

    const owned = all.filter((g) => g.stores.some((x) => x.k !== 'perdido')).length;
    return {
      games,
      tabs,
      empty: games.length === 0,
      summary: `${owned} juegos en 7 tiendas · 1 en «Quiero jugarlo»`
    };
  }
}
</script>
</body>
</html>
